<!DOCTYPE html>

    <!-- Single Page Apps for GitHub Pages redirect receiver -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        } else if (l.hash && l.hash.startsWith('#/')) {
          // Backward compatibility: automatically convert legacy /#/ URLs to clean paths
          window.history.replaceState(null, null, l.hash.slice(1));
        }
      }(window.location));
    </script>
